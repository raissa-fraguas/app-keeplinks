<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with squircle -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Outer glowing badge -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#grad1)" filter="url(#shadow)" opacity="0.9" />
  
  <!-- Inner dark shield -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="#090d16" />
  
  <!-- Central Bookmark & Chain Link Icon -->
  <g transform="translate(136, 116)">
    <!-- Bookmark silhouette -->
    <path d="M40 0 H200 C217.673 0 232 14.327 232 32 V260 L120 200 L8 260 V32 C8 14.327 22.327 0 40 0 Z" fill="url(#grad1)" />
    <!-- Link rings overlapping in center -->
    <path d="M70 70 A30 30 0 0 1 120 70 L130 80 A12 12 0 0 1 113 97 L103 87 A10 10 0 0 0 88 87 L68 107 A10 10 0 0 0 82 122 L72 132 A30 30 0 0 1 70 70 Z" fill="#ffffff" />
    <path d="M170 170 A30 30 0 0 1 120 170 L110 160 A12 12 0 0 1 127 143 L137 153 A10 10 0 0 0 152 153 L172 133 A10 10 0 0 0 158 118 L168 108 A30 30 0 0 1 170 170 Z" fill="#ffffff" />
    <line x1="90" y1="150" x2="150" y2="90" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>
  
  <!-- Sparkles -->
  <circle cx="390" cy="120" r="14" fill="#38bdf8" />
  <circle cx="120" cy="390" r="10" fill="#f43f5e" />
  <circle cx="390" cy="380" r="16" fill="#a855f7" />
</svg>
